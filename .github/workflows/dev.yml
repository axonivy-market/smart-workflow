name: Dev-Build

on:
  push:
  schedule:
    - cron:  '21 21 * * *'
  workflow_dispatch:
    inputs:
      ivyVersion:
        type: string
        required: false
        default: dev
        description: ivy engine permalink (e.g. sprint, nightly, dev)

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    uses: axonivy-market/github-workflows/.github/workflows/dev.yml@v6
    with:
      targetBranchForBuildFromMaster: master
      ivyVersion: ${{ inputs.ivyVersion || 'dev' }}
