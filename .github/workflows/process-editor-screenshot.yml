name: Screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture Screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run screenshot tests
        run: mvn -B -ntp -P webtest.test -pl smart-workflow-screenshot -am verify

      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: smart-workflow-screenshot/target/selenide/reports/**/*.png
          if-no-files-found: warn
          retention-days: 14