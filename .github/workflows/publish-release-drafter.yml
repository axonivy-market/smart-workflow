name: Publish Release Drafter

on:
  workflow_run:
    workflows: ["Release-Build"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  publish_release_drafter:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: axonivy-market/github-workflows/.github/workflows/publish-release-drafter.yml@v14