# yaml-language-server: $schema=https://json-schema.axonivy.com/14.0/config/variables.json
Variables:
  AI:
    Providers:
      Aura:
        # Sent as an Authorization: Bearer credential. Configure in the Engine Cockpit.
        #[password]
        APIKey: ${decrypt:}
        # Required OpenAI-compatible API root; the client appends chat/completions.
        BaseUrl: ""
        # Required unless a model is explicitly specified on the calling Agent.
        DefaultModel: ""
        # guid
        OrgId: ""
        # xyz.docuware.cloud
        Host: ""
        OAuth2:
          # guid
          AppId: ""
          # [enum: client_credentials, authorization_code, authorization_code_pkce]
          Mode:
          # [password]
          ClientSecret:
          # OAuth2 scopes requested for Aura access.
          # authorization_code_pkce=docuware.platform openid dwprofile offline_access
          # client_credentials=docuware.userProvisioning
          Scope: