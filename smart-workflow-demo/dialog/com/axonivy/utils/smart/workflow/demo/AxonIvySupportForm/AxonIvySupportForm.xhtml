<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{ivy.cms.co('/Dialogs/com/axonivy/utils/smart/workflow/demo/AxonIvySupportForm/AxonIvySupport')}</ui:define>
    <ui:define name="content">
      <h:form id="chatForm">
        <div class="w-full max-w-4xl mx-auto py-3">
          <!-- the chatbot passes these tool names to its agent; the tool process lives in this project -->
          <ic:com.axonivy.utils.ai.components.Chatbot id="supportChat"
            assistantName="#{ivy.cms.co('/Dialogs/com/axonivy/utils/smart/workflow/demo/AxonIvySupportForm/AxonIvySupport')}"
            tools="#{['createAxonIvySupportTicket', 'createAxonIvySupportTaskInfo']}"
            customSystemPrompt="You help users report problems with Axon Ivy Core, Portal or Market products to the support team. Follow these steps:&#10;1. Call createAxonIvySupportTicket with the user's full problem report.&#10;2. If its message says information is missing, ask the user for exactly that and stop. When the user answers, call createAxonIvySupportTicket again with the earlier report and the new information.&#10;3. When its message says the ticket is complete, call createAxonIvySupportTaskInfo with that ticket unchanged.&#10;4. Tell the user the outcome in one or two sentences.&#10;For questions that are not problem reports, answer directly without these tools."
            minHeight="40rem" maxHeight="40rem" />
        </div>
      </h:form>
    </ui:define>
  </ui:composition>
</h:body>

</html>
