<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">Support Ticket</ui:define>
    <ui:define name="content">

      <h:form id="form">
        <p:messages />

        <p:panel header="#{data.supportTicket.title}">
          <div class="grid">
            <div class="col-12 sm:col-6 lg:col">
              <div class="text-sm text-color-secondary mb-1">Category</div>
              <p:tag value="#{data.supportTicket.type}" />
            </div>
            <div class="col-12 sm:col-6 lg:col">
              <div class="text-sm text-color-secondary mb-1">Version</div>
              <h:outputText value="#{data.supportTicket.version}" />
            </div>
            <div class="col-12 sm:col-6 lg:col">
              <div class="text-sm text-color-secondary mb-1">OS system</div>
              <h:outputText value="#{data.supportTicket.systemOS}" />
            </div>
            <div class="col-12 sm:col-6 lg:col">
              <div class="text-sm text-color-secondary mb-1">Reporter</div>
              <h:outputText value="#{data.supportTicket.reporter}" />
            </div>
            <div class="col-12 sm:col-6 lg:col">
              <div class="text-sm text-color-secondary mb-1">Created date</div>
              <h:outputText value="#{ivy.task.startTimestamp}" />
            </div>
          </div>

          <p:divider />

          <div class="field">
            <p:outputLabel for="description" value="Description" />
            <p:inputTextarea id="description" value="#{data.supportTicket.description}" rows="4" styleClass="w-full" />
          </div>
          <div class="field">
            <p:outputLabel for="stackTrace" value="Stack trace" />
            <p:inputTextarea id="stackTrace" value="#{data.supportTicket.stackTrace}" rows="6" styleClass="w-full" />
          </div>
          <div class="field mb-0">
            <p:outputLabel for="solution" value="Solution" />
            <p:inputTextarea id="solution" value="#{data.supportTicket.solution}" rows="4" styleClass="w-full" required="true" />
          </div>
        </p:panel>

        <div class="flex justify-content-end align-items-center gap-2 mt-3">
          <p:commandButton id="cancel" actionListener="#{ivyWorkflowView.cancel()}" process="@this" value="Cancel"
            styleClass="ui-button-secondary ui-button-outlined" />
          <p:commandButton id="proceed" actionListener="#{logic.close}" value="Proceed" update="form" icon="pi pi-check" />
        </div>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>

</html>
